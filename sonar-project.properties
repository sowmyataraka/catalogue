sonar.projectKey=roboshop-catalogue
sonar.projectName=roboshop-catalogue
sonar.sources=.
sonar.exclusions=node_modules/**,Jenkinsfile, Dockerfile, coverage/**,test/**, .git/**

sonar.tests=test
sonar.test.inclusions=test/**/*.test.js
# Coverage report is generated by jest(lcov format)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Test results in junit format generated by jest.junit
sonar.junit.reportPaths=test-results.xml
